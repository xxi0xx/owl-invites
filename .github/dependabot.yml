version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: [dependencies]

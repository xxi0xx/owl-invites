name: Release

on:
  push:
    tags: ['v*', 'review-sha-*']
  workflow_dispatch:
    inputs:
      publish_review_artifact:
        description: Publish a non-stable sha-<full-commit> review image after verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch authoritative main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Validate release or review source
        id: release
        env:
          IS_TAG_EVENT: ${{ github.event_name == 'push' }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          stable=false
          if [[ "$IS_TAG_EVENT" == "true" && "$RELEASE_TAG" == review-sha-* ]]; then
            bash scripts/validate-review-ref.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
            version=dev
          elif [[ "$IS_TAG_EVENT" == "true" ]]; then
            bash scripts/validate-release-ref.sh "$RELEASE_TAG" "$RELEASE_COMMIT" refs/remotes/origin/main
            version="$RELEASE_TAG"
            stable=true
          else
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/codex/*) ;;
              *) echo "review publication is allowed only from main or codex/* branches" >&2; exit 1 ;;
            esac
            test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
            version=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  product-verification:
    name: Authoritative product gate
    needs: validate
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    name: Publish immutable image
    if: github.event_name == 'push' || inputs.publish_review_artifact
    needs: [validate, product-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }},enable=${{ needs.validate.outputs.stable == 'true' }}
            type=raw,value=sha-${{ needs.validate.outputs.commit }}
      - name: Build and publish multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ needs.validate.outputs.commit }}
            BUILD_STATE=clean
            SOURCE_URL=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the published image digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify published SBOM and provenance
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" \
            --format '{{ json (index .SBOM "linux/amd64").SPDX }}' \
            | jq -e '.SPDXID == "SPDXRef-DOCUMENT" and (.packages | length > 0)'
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          {
            echo "### Published Owl Invites image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: Release preparation dry run
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_review_artifact
    needs: [validate, product-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build both production architectures without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ needs.validate.outputs.commit }}
            BUILD_STATE=clean
            SOURCE_URL=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max

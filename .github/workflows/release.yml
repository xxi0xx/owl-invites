name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Fetch authoritative main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Validate exact tag and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          bash scripts/validate-release-ref.sh "$RELEASE_TAG" "$RELEASE_COMMIT" refs/remotes/origin/main
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  product-verification:
    name: Authoritative product gate
    needs: validate
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    name: Publish immutable release image
    if: github.event_name == 'push'
    needs: [validate, product-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=sha-${{ needs.validate.outputs.commit }}
      - name: Build and publish multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ needs.validate.outputs.commit }}
            BUILD_STATE=clean
            SOURCE_URL=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the published image digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify published SBOM and provenance
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" \
            --format '{{ json (index .SBOM "linux/amd64").SPDX }}' \
            | jq -e '.SPDXID == "SPDXRef-DOCUMENT" and (.packages | length > 0)'
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          {
            echo "### Published Owl Invites image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: Release preparation dry run
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, product-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both production architectures without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ needs.validate.outputs.commit }}
            BUILD_STATE=clean
            SOURCE_URL=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max

services:
  openrsvp:
    build: .
    depends_on:
      - mailpit
    ports:
      - "8091:8080"
    volumes:
      - openrsvp-data:/data
    env_file:
      - .env
    environment:
      - DB_DRIVER=sqlite
      - DB_DSN=/data/openrsvp.db
      - UPLOADS_DIR=/data/uploads
      - NOTIFICATION_EMAIL_PROVIDER=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@owl-invites.local
      - BASE_URL=http://localhost:8091
      - FEEDBACK_EMAIL=feedback@openrsvp.local
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  openrsvp-data:
